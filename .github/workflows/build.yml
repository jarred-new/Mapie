name: Build Qt Quick App

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64

      - name: Build
        run: |
          cmake --build build `
            --config Release `
            --parallel

      - name: Deploy Qt
        run: |
          mkdir package
          windeployqt `
            --release `
            --qmldir src `
            build\Release\appMapie.exe

          copy build\Release\appMapie.exe package\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mapie-Windows-x64
          path: package/