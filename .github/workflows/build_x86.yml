name: Build Mapie x86

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  QT_VERSION: "6.8.3"

jobs:
  build_x86:
    name: Build Mapie - Windows x86
    runs-on: windows-2022

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Show runner information
      # ------------------------------------------------------------
      - name: Show environment
        shell: pwsh
        run: |
          Write-Host "Windows:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

          Write-Host ""
          Write-Host "CMake:"
          cmake --version

      # ------------------------------------------------------------
      # Install Qt
      #
      # IMPORTANT:
      # The Qt package architecture must actually exist for the
      # selected Qt version.
      # ------------------------------------------------------------
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          set-env: true

      # ------------------------------------------------------------
      # Configure MSVC for x86
      # ------------------------------------------------------------
      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      # ------------------------------------------------------------
      # Verify MSVC
      # ------------------------------------------------------------
      - name: Check MSVC
        shell: cmd
        run: |
          where cl
          where link
          cl

      # ------------------------------------------------------------
      # Verify Qt
      # ------------------------------------------------------------
      - name: Check Qt
        shell: cmd
        run: |
          where qmake
          qmake -v

      # ------------------------------------------------------------
      # Show Qt environment
      # ------------------------------------------------------------
      - name: Show Qt environment
        shell: pwsh
        run: |
          Write-Host "QT_ROOT_DIR = $env:QT_ROOT_DIR"
          Write-Host "Qt6_DIR     = $env:Qt6_DIR"
          Write-Host "PATH:"
          $env:PATH -split ";" |
            Where-Object { $_ -match "Qt" } |
            ForEach-Object { Write-Host $_ }

      # ------------------------------------------------------------
      # Configure CMake
      # ------------------------------------------------------------
      - name: Configure CMake
        shell: cmd
        run: |
          cmake ^
            -S . ^
            -B build ^
            -G "Visual Studio 17 2022" ^
            -A Win32 ^
            -DCMAKE_BUILD_TYPE=Release

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build Mapie
        shell: cmd
        run: |
          cmake ^
            --build build ^
            --config Release ^
            --parallel 2

      # ------------------------------------------------------------
      # Show generated files
      # ------------------------------------------------------------
      - name: List build output
        shell: pwsh
        run: |
          Write-Host "Build directory:"
          Get-ChildItem -Path build -Recurse -File |
            Select-Object FullName

      # ------------------------------------------------------------
      # Upload build
      # ------------------------------------------------------------
      - name: Upload Mapie
        uses: actions/upload-artifact@v4
        with:
          name: Mapie-Windows-x86
          path: |
            build/Release/*.exe
            build/Release/*.dll
          if-no-files-found: warn