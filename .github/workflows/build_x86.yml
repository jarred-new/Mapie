name: Build Mapie x86

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"
  BUILD_TYPE: Release

jobs:
  build-x86:
    name: Mapie Windows x86
    runs-on: windows-2022

    steps:

      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # Python x86
      # ============================================================
      - name: Setup Python x86
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x86


      # ============================================================
      # Verify Python
      # ============================================================
      - name: Verify Python x86
        shell: cmd
        run: |
          echo ========================================
          echo Python
          echo ========================================

          python --version

          echo.
          python -c "import platform; print('Architecture:', platform.architecture()[0])"

          echo.
          where python


      # ============================================================
      # Show CMake
      # ============================================================
      - name: Verify CMake
        shell: cmd
        run: |
          cmake --version


      # ============================================================
      # Install Qt
      # ============================================================
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtlocation
          cache: true
          set-env: true


      # ============================================================
      # Verify Qt
      # ============================================================
      - name: Verify Qt
        shell: cmd
        run: |
          echo ========================================
          echo Qt
          echo ========================================

          echo QT_ROOT_DIR=%QT_ROOT_DIR%

          echo.
          where qmake

          echo.
          qmake -v


      # ============================================================
      # Setup MSVC x86
      # ============================================================
      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86


      # ============================================================
      # Verify MSVC x86
      # ============================================================
      - name: Verify MSVC x86
        shell: cmd
        run: |
          echo ========================================
          echo MSVC x86
          echo ========================================

          where cl

          echo.
          cl


      # ============================================================
      # Configure CMake
      # ============================================================
      - name: Configure CMake x86
        shell: cmd
        run: |
          cmake ^
            -S . ^
            -B build ^
            -G "Visual Studio 17 2022" ^
            -A Win32 ^
            -DCMAKE_PREFIX_PATH="%QT_ROOT_DIR%" ^
            -DCMAKE_BUILD_TYPE=Release


      # ============================================================
      # Build
      # ============================================================
      - name: Build Mapie x86
        shell: cmd
        run: |
          cmake ^
            --build build ^
            --config Release ^
            --parallel 2


      # ============================================================
      # Find executable
      # ============================================================
      - name: Find executable
        shell: pwsh
        run: |
          Write-Host "Searching for Mapie executable..."

          $exe = Get-ChildItem `
            -Path build `
            -Recurse `
            -Filter "*.exe" |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host "No executable found."
            exit 1
          }

          Write-Host ""
          Write-Host "Found:"
          Write-Host $exe.FullName


      # ============================================================
      # Deploy Qt
      # ============================================================
      - name: Deploy Qt
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            -Path build `
            -Recurse `
            -Filter "*.exe" |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host "Executable not found."
            exit 1
          }

          Write-Host "Deploying Qt..."

          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release `
            --qmldir "$env:GITHUB_WORKSPACE" `
            "$($exe.FullName)"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }


      # ============================================================
      # Package
      # ============================================================
      - name: Package Mapie
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            -Path build `
            -Recurse `
            -Filter "*.exe" |
            Select-Object -First 1

          if (-not $exe) {
            exit 1
          }

          $package = "$env:GITHUB_WORKSPACE\Mapie-Windows-x86"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $package | Out-Null

          Copy-Item `
            -Path "$($exe.Directory.FullName)\*" `
            -Destination $package `
            -Recurse `
            -Force

          Compress-Archive `
            -Path "$package\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\Mapie-Windows-x86.zip" `
            -Force


      # ============================================================
      # Upload artifact
      # ============================================================
      - name: Upload Mapie x86
        uses: actions/upload-artifact@v4
        with:
          name: Mapie-Windows-x86
          path: Mapie-Windows-x86.zip
          if-no-files-found: error